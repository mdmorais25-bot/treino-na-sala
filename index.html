.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;font-weight:800;text-transform:uppercase;line-height:1}
h2{font-size:24px;font-weight:700;text-transform:uppercase;line-height:1.05}
h3{font-size:19px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs a{text-align:center;padding:9px 4px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero{border:0;background:var(--accent);color:var(--accent-ink)}
.hero .label{color:inherit;opacity:.8}
.hero h2{font-size:34px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid currentColor;opacity:.9}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.btn{background:var(--ink);color:var(--bg)}
.hero .btn{background:var(--accent-ink);color:var(--accent);font-size:17px;padding:14px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.week span{height:8px;border-radius:4px;background:var(--line)}
.week span.on{background:var(--rest)}
.ex{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.ex:first-of-type{border-top:0}
.ex .fig{grid-row:span 2;width:64px;height:52px;background:var(--bg);border-radius:10px;color:var(--ink)}
.ex b{font-weight:600}
.ex .dose{font-family:var(--display);font-weight:700;font-size:17px;text-align:right;white-space:nowrap}
.ex small{grid-column:2/-1;color:var(--muted);font-size:13px;line-height:1.4}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{background:transparent;color:var(--muted);padding:7px 4px;font-size:13px;border-radius:8px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.hero .seg button{color:inherit;opacity:.85;font-size:15px;font-family:var(--display);font-weight:700}
.hero .seg button[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent);opacity:1;box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{display:flex;flex-direction:column}
.stats .num{font-size:30px;font-weight:700;line-height:1}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.tag{display:inline-block;width:22px;height:22px;border-radius:6px;text-align:center;font-family:var(--display);font-weight:800;line-height:22px;color:var(--bg);background:var(--ink);margin-right:8px}
.tag.C{background:var(--work)}
.chart{width:100%;height:auto;display:block}

.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=number]{font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
input[type=number]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:14px;cursor:pointer;background:var(--bg)}
.opts input{position:absolute;opacity:0;pointer-events:none}
.pill{border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:500;background:var(--bg);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}

.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}

.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);list-style-position:inside}
details.more summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
details.more[open] summary{color:var(--ink);margin-bottom:4px}
.fig{display:block}
.fig .flr{stroke:currentColor;opacity:.3}
.fig .prop{stroke:currentColor;opacity:.55;fill:none}
.fig .far{opacity:.45}

#session{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);

.s-in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px;min-height:0;position:relative}
.s-top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.x{background:transparent;color:var(--muted);padding:6px 10px;font-size:22px;line-height:1}
.stage{flex:1;border-radius:22px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;color:#fff;background:var(--ink);min-height:0;overflow:auto}
.stage.work{background:var(--work)} .stage.rest{background:var(--rest)} .stage.prep{background:var(--accent)}
.stage .label{color:inherit;opacity:.85}
.stage h2{font-size:36px;line-height:1}
.stage .fig{width:100%;max-width:300px;height:auto;max-height:26vh;margin:0 auto;color:#fff}
.mainrow{display:flex;align-items:baseline;gap:8px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,120px);line-height:.9;font-variant-numeric:tabular-nums}
.unit{font-weight:600;font-size:16px;opacity:.9}
.cue{font-size:16px;max-width:42ch}
.next{font-size:14px;opacity:.9}
.s-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s-ctrl .wide{grid-column:1/-1;font-size:18px;padding:16px}
.s-ctrl.three{grid-template-columns:repeat(3,1fr)}
.vbtn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 10px;font-size:12px;border-radius:99px;font-weight:600;white-space:nowrap}
.vbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.s-ctrl button:disabled{opacity:.4;cursor:default}
#clock{display:inline-block}
@keyframes pop{0%{transform:scale(1.25);opacity:.6}100%{transform:scale(1);opacity:1}}
.stage.tick #clock{animation:pop .45s ease-out}
.confirm{position:absolute;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:center;justify-content:center;padding:24px;border-radius:22px}
.confirm .card{max-width:340px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function setFig(svg,t){
  const f=FIG[svg.dataset.fig],A=PO[f.a],B=PO[f.b],p=A.map((v,i)=>v+(B[i]-v)*t);
  const P=i=>p[i*2].toFixed(1)+' '+p[i*2+1].toFixed(1);
  svg.querySelector('.near').setAttribute('d',`M${P(1)}L${P(2)}M${P(2)}L${P(3)}L${P(4)}M${P(1)}L${P(7)}L${P(8)}`);
  svg.querySelector('.far').setAttribute('d',`M${P(2)}L${P(5)}L${P(6)}M${P(1)}L${P(9)}L${P(10)}`);
  const h=svg.querySelector('.hd');h.setAttribute('cx',p[0]);h.setAttribute('cy',p[1]);
  const bel=svg.querySelector('.bel');
  if(bel){const dx=p[4]-p[2],dy=p[5]-p[3],L=Math.hypot(dx,dy)||1,o=f.front?0:5;
    bel.setAttribute('cx',(p[2]+dx*.6+dy/L*o).toFixed(1));bel.setAttribute('cy',(p[3]+dy*.6-dx/L*o).toFixed(1));}
  const bag=svg.querySelector('.bag');if(bag){bag.setAttribute('x',p[16]-6);bag.setAttribute('y',p[17]);}
  const b1=svg.querySelector('.bt1');if(b1){b1.setAttribute('x',p[16]-2.5);b1.setAttribute('y',p[17]-5);const b2=svg.querySelector('.bt2');b2.setAttribute('x',p[20]-2.5);b2.setAttribute('y',p[21]-5);}
}

function animate(ts){
  document.querySelectorAll('svg[data-fig]').forEach(s=>{
    const per=FIG[s.dataset.fig].fast?900:2600;
    /* durante a contagem guiada, o boneco faz uma repetição por número falado */
    const r=typeof X!=='undefined'&&X&&X.rep,sync=r&&r.stage==='count'&&!X.paused&&s.closest('.stage');
    if(sync&&!still.matches){const cad=cadOf(X.steps[X.i]),ph=((r.t-r.t0+(Date.now()-r.last)/1000)%cad)/cad;setFig(s,(1-Math.cos(ph*2*Math.PI))/2);return;}
    setFig(s,still.matches?1:(1-Math.cos(ts/per*2*Math.PI))/2);
  });
  requestAnimationFrame(animate);
}

/* troca de modo: as variáveis abaixo apontam para os dados do modo atual */
let W,WARM,WARM_S,MOB,COOLS,LV,REST,DUR,FEEL;
function gWeek(p){return p.week+Math.floor((Date.now()-new Date(p.weekDate))/(7*864e5));}
const triOf=w=>w<=13?0:w<=27?1:2;

  const g=GEST();

  LV=g?LVG:LVN;REST=RESTN;DUR=g?[15,20,30]:DURN;FEEL=g?FEELG:FEELN;

}
const ROTS={gordura:['A','C','B','C'],forca:['A','B','C'],cond:['C','A','C','B'],geral:['A','C','B']};

let S={levels:{A:0,B:0,C:0},rot:0,dur:30,history:[],profile:null,skipped:false,weights:[]};
try{const raw=localStorage.getItem('treino-sala');if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}

const $=s=>document.querySelector(s);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const dDate=d=>new Date(d).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x;}
function thisWeek(){const w=weekStart(new Date()).getTime();return S.history.filter(h=>new Date(h.date)>=w);}

/* ---------- perfil e recomendação ---------- */
const rotation=()=>GEST()?['A','C','B','C']:(ROTS[S.profile?.goal]||ROTS.gordura);
const nextType=()=>{const r=rotation();return r[S.rot%r.length];};
const dec1=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:1});
function bmi(p){return p&&p.kg&&p.cm?p.kg/((p.cm/100)**2):null;}
function bmiText(b){return b<18.5?'abaixo da faixa recomendada':b<25?'na faixa recomendada':b<30?'acima da faixa recomendada':'bem acima da faixa recomendada';}
function recommend(p){
  const act={sed:0,pouco:0,ativo:1,muito:2}[p.act]??0;
  const fromAct=Math.min(act,1);
  let A=p.sq&&p.sq!=='x'?{a:0,b:1,c:2}[p.sq]:fromAct;
  let B=p.push&&p.push!=='x'?{a:0,b:1,c:2}[p.push]:fromAct;
  let C=act;const b=bmi(p),notes=[];
  const adaptW={sed:2,pouco:1}[p.act]||0;
  if(adaptW)notes.push(`${adaptW===1?'Na primeira semana':'Nas primeiras '+adaptW+' semanas'}, no máximo 3 treinos por semana. O corpo se acostuma com o esforço e você evita dor muscular forte.`);
  if(b&&b>=30){C=0;A=Math.min(A,1);notes.push('Circuito começa no nível mais leve, com polichinelo e burpee sem salto, para poupar os joelhos.');}
  if(p.health){A=B=C=0;notes.push('Como você marcou dor ou problema de saúde, tudo começa no Iniciante. Converse com um médico antes de aumentar a intensidade e pare se sentir dor.');}
  if(b&&b<18.5&&p.goal==='gordura')notes.push('Seu IMC já está abaixo da faixa recomendada. Em vez de perder peso, vale focar em ganhar força e comer bem.');
  else if(p.goal==='gordura')notes.push('Para perder gordura, a alimentação pesa mais que o treino. Nos dias sem treino, caminhe 30 minutos.');
  if(p.goal==='forca')notes.push('Mais treinos A e B na semana. Suba de nível sempre que as séries ficarem fáceis.');
  if(p.goal==='cond')notes.push('Mais circuitos na semana para melhorar o fôlego.');
  return {levels:{A,B,C},dur:p.act==='sed'?Math.min(p.dur||20,20):(p.dur||30),adaptW,notes};
}
function recG(p){
  const notes=[],adaptW={nao:2,asvezes:1}[p.prev]||0,wk=gWeek(p),t=triOf(wk);
  const dur=p.prev==='nao'?Math.min(p.dur,15):p.prev==='asvezes'?Math.min(p.dur,20):p.dur;
  if(adaptW)notes.push(`${adaptW===1?'Na primeira semana':'Nas primeiras 2 semanas'}, no máximo 3 treinos de ${dur} minutos. Depois, se estiver tudo bem, dá para aumentar o tempo aos poucos.`);
  notes.push('Intensidade certa: você deve conseguir conversar durante todo o exercício. Se não conseguir falar, diminua o ritmo.');
  if(t>=1)notes.push('A partir do 2º trimestre, evite ficar deitada de barriga para cima. O app já troca esses exercícios.');
  if(t===2)notes.push('No 3º trimestre o equilíbrio muda. Treine sempre perto de uma parede ou cadeira firme.');
  notes.push('Beba água antes, durante e depois. Evite treinar em lugar muito quente ou abafado.');
  notes.push('Somando treinos e caminhadas leves, a meta recomendada é chegar a cerca de 150 minutos por semana, se o médico concordar.');
  return {dur,adaptW,notes};
}
function adaptInfo(){
  const p=S.profile;if(!p)return null;const w=(p.mode==='gest'?recG(p):recommend(p)).adaptW;if(!w)return null;
  const wk=Math.floor((Date.now()-new Date(p.start))/(7*864e5));
  return wk<w?{wk:wk+1,of:w}:null;
}
function weeklyGoal(){const d=S.profile?.days||4,a=adaptInfo();return a?Math.min(d,3):d;}

/* ---------- montagem do treino pelo tempo disponível ---------- */
function makeSteps(type,o){
  const lv=S.levels[type],w=W[type],st=[];
  const pre=[...(o.warm?WARM:WARM_S).map(e=>({...e,ph:'Aquecimento'})),...MOB[type].map(e=>({...e,ph:'Mobilidade'}))];
  pre.forEach((e,i)=>st.push({k:'time',ph:e.ph,n:e.n,c:e.c,f:e.f,t:e.t,next:i<pre.length-1?pre[i+1].n:null}));
  st.push({k:'rest',ph:'Aquecimento concluído',tr:1,t:20,next:(w.circuit?w.items[lv][0]:o.ex[0]).n});
  if(w.circuit){
    const ex=w.items[lv],R=o.rounds;
    for(let r=0;r<R;r++)ex.forEach((e,i)=>{
      st.push({k:'time',ph:'Volta '+(r+1)+' de '+R,n:e.n,c:e.c,f:e.f,t:w.work[lv]});
      const last=i===ex.length-1;
      if(!(last&&r===R-1))st.push({k:'rest',ph:last?'Fim da volta':'Descanso',t:last?60:w.rest[lv],next:ex[last?0:i+1].n});
    });
  }else{
    o.ex.forEach((e,i)=>{for(let s=0;s<e.s;s++){
      st.push(e.h?{k:'time',ph:'Série '+(s+1)+' de '+e.s,n:e.n,c:e.c,f:e.f,t:e.h}:{k:'reps',ph:'Série '+(s+1)+' de '+e.s,n:e.n,c:e.c,f:e.f,r:e.r});
      const lastSet=s===e.s-1,lastEx=i===o.ex.length-1;
      if(!(lastSet&&lastEx))st.push({k:'rest',ph:'Descanso',t:restOf(w,lv),next:lastSet?o.ex[i+1].n:e.n+' · série '+(s+2)});
    }});
  }
  if(o.cool)COOLS[type].forEach(e=>st.push({k:'time',ph:e.ph||'Alongamento',n:e.n,c:e.c,f:e.f,t:e.t}));
  return st;
}
const restOf=(w,lv)=>{const p=S.restPref;if(p&&p!=='auto')return GEST()?Math.max(+p,60):+p;return w.restS?w.restS[lv]:REST[lv];};
const RESTOPTS=()=>GEST()?[60,75,90,120]:[30,45,60,80,90,120];
const fmtRest=t=>t<60?t+' s':t%60?Math.floor(t/60)+' min '+t%60:Math.floor(t/60)+' min';
/* segundos por repetição, conforme o exercício; o ritmo escolhido multiplica */
const CAD={squatC:3.5,bulg:3.5,lunge:3.5,bridge:3,bridge1:3.5,calf:3,calfW:3,push:3,inc:3,dec:3,wall:3,row:3,dip:3,dipL:3,lat:3,pike:3.5,pikeC:3.5,bird:4,sup:3,abd:3,hipE:3};
const PACE={lento:1.25,normal:1,rapido:.8};
const PACEN={lento:'Lento',normal:'Normal',rapido:'Rápido'};
const countOn=()=>S.count!==false;
/* lados: alternado = troca a cada repetição; unilateral = todas de um lado e depois do outro */
const SIDE={perna:[['a perna direita','a perna esquerda'],['Direita','Esquerda']],braço:[['o braço direito','o braço esquerdo'],['Direito','Esquerdo']],lado:[['o braço direito','o braço esquerdo'],['Braço direito','Braço esquerdo']]};
function repInfo(r,name){const nums=(r.match(/\d+/g)||['10']).map(Number),m=r.match(/por (\S+)/),word=m?m[1]:'';
  return {n:Math.max(...nums),sides:m?2:1,word,alt:!!m&&/alternad|com salto|perdigueiro/i.test(name||''),sd:SIDE[word]||SIDE.lado};}
const cadOf=s=>(CAD[s.f]||3)*(PACE[S.pace]||1)*(GEST()?1.15:1);
const LEAD=4.5,LEADGO=1.2,SWAP=4;
const stepSec=s=>{if(s.t)return s.t+(s.k==='time'?3:0);if(!countOn())return /por /.test(s.r)?60:40;const ri=repInfo(s.r,s.n);
  return LEAD+ri.n*cadOf(s)*ri.sides+(ri.sides>1&&!ri.alt?SWAP:0)+2;};
const estSec=st=>st.reduce((a,s)=>a+stepSec(s),0);
const cache={};
function config(type){
  const lv=S.levels[type],key=[GEST()?'g':'n',type,lv,S.dur,S.restPref,S.pace,countOn()].join('|');if(cache[key])return cache[key];
  const w=W[type],goal=S.dur*60,cands=[];
  for(const warm of [true,false])for(const cool of [true]){
    const pen=(warm?0:60)+(cool?0:90);
    if(w.circuit){for(let R=1;R<=w.maxR[lv];R++)cands.push({warm,cool,rounds:R,pen});}
    else for(let n=5;n>=(GEST()?2:3);n--)for(const adj of [1,0,-1]){
      const pick=w.keep.slice(0,n).sort((a,b)=>a-b);
      const ex=pick.map(i=>{const e=w.items[i][lv];return {...e,s:Math.min(w.maxS||4,Math.max(2,e.s+adj))};});
      cands.push({warm,cool,ex,pen:pen+(5-n)*45});
    }
  }
  let best=null,bs=-1e9,min=null;
  cands.forEach(c=>{c.sec=estSec(makeSteps(type,c));const sc=c.sec-c.pen;
    if(c.sec<=goal&&sc>bs){bs=sc;best=c;} if(!min||c.sec<min.sec)min=c;});
  return cache[key]=best||min;
}
function listItems(type){
  const lv=S.levels[type],w=W[type],c=config(type);
  if(w.circuit)return w.items[lv].map(e=>({...e,dose:w.work[lv]+'s'}));
  return c.ex.map(e=>({...e,dose:e.s+' × '+(e.h?e.h+'s':e.r)}));
}
const estMin=t=>Math.round(config(t).sec/60);
function suggestion(){
  if(GEST())return null;
  for(const t of ['A','B','C']){
    const lv=S.levels[t];if(lv>=2)continue;
    const last=S.history.filter(h=>h.type===t&&h.level===lv).slice(-3);
    if(last.length===3&&last.every(h=>h.feel==='facil'))return t;
  }return null;
}

/* ---------- telas ---------- */
const durSeg=()=>`<div class="seg" style="--n:${DUR.length}" role="group" aria-label="Tempo disponível">${DUR.map(d=>`<button aria-pressed="${d===S.dur}" data-dur="${d}">${d} min</button>`).join('')}</div>`;
const exRow=(e,cue)=>`<div class="ex">${fig(e.f)}<b>${e.n}</b><span class="dose">${e.dose}</span>${cue?`<small>${e.c}</small>`:''}</div>`;
function summary(t){const w=W[t],lv=S.levels[t],c=config(t);
  return (w.circuit?`${c.rounds} ${c.rounds>1?'voltas':'volta'} · ${w.work[lv]}s de esforço / ${w.rest[lv]}s de pausa`:`${c.ex.length} exercícios · descanso de ${restOf(w,lv)}s`)
    +` · aquecimento ${c.warm?'completo':'curto'} · 2 min de mobilidade`+(c.cool?(GEST()?' · alongamento e respiração no fim':' · alongamento no fim'):'');}
const prepRows=t=>`<details class="more"><summary>Antes: 2 min de mobilidade</summary><div>${MOB[t].map(e=>exRow({...e,dose:e.t+'s'},true)).join('')}</div></details>
  <details class="more"><summary>Depois: ${GEST()?'alongamento e respiração':'alongamento'}</summary><div>${COOLS[t].map(e=>exRow({...e,dose:e.t+'s'},true)).join('')}</div></details>`;
const dangerCard=open=>`<section class="card"><details class="more" style="border:0;padding:0" ${open?'open':''}><summary style="color:var(--work)">Pare e procure o médico se sentir</summary>
  <ul class="notes" style="margin-top:8px">${DANGER.map(d=>`<li>${d}</li>`).join('')}</ul></details></section>`;
function vHoje(){
  const t=nextType(),w=W[t],lv=S.levels[t],done=thisWeek().length,sug=suggestion(),G=weeklyGoal(),ad=adaptInfo();
  let h=`<div class="stack">`;const g=GEST();
  if(!S.profile&&!S.skipped)h+=`<section class="card"><h3>Quer um plano sob medida?</h3><p class="muted">Responda algumas perguntas rápidas e o app escolhe o nível de cada treino, quantos dias por semana e como começar. Tem também um modo para gestantes. É opcional.</p>
    <div class="row"><button class="btn" data-go="perfil">Montar meu plano</button><button class="ghost" data-skip="1">Agora não</button></div></section>`;
  if(g&&gBlocked(S.profile))return h+`<section class="card"><span class="label">Modo gestante</span><h2>Treinos pausados</h2>
    <p class="muted">${!S.profile.cleared?'Para montar os treinos, o app precisa que o obstetra tenha liberado atividade física.':'Com a situação que você marcou, o exercício precisa ser orientado diretamente pelo médico.'} Converse na próxima consulta e depois atualize o cadastro.</p>
    <button class="btn" data-go="perfil">Atualizar cadastro</button></section>${dangerCard(true)}</div>`;
  if(g&&S.lastDiscomfort&&Date.now()-new Date(S.lastDiscomfort)<3*864e5)h+=`<section class="card" style="border-color:var(--work)"><h3>Você sentiu desconforto no último treino</h3>
    <p class="muted">Descanse hoje. Se o desconforto continuar ou aparecer algum dos sinais abaixo, procure seu médico antes de treinar de novo.</p>
    <ul class="notes">${DANGER.map(d=>`<li>${d}</li>`).join('')}</ul><button class="ghost" data-okdisc="1">Estou bem, ocultar aviso</button></section>`;
  h+=`<section class="card hero"><span class="label">Próximo treino · ${w.kind}</span>
    <h2>Treino ${t}: ${w.title}</h2>
    <div class="stack" style="gap:6px"><span class="label">Quanto tempo você tem?</span>${durSeg()}</div>
    <div class="chips">${ad?`<span class="chip">Adaptação · semana ${ad.wk} de ${ad.of}</span>`:''}<span class="chip">${LV[lv]}</span>${g?`<span class="chip">${gWeek(S.profile)}ª semana</span>`:''}<span class="chip">≈ ${estMin(t)} min</span><span class="chip">sem equipamento</span></div>
    <button class="btn" data-start="${t}">Começar treino ${t}</button></section>`;
  if(sug)h+=`<section class="card"><h3>O treino ${sug} ficou fácil</h3><p class="muted">Você marcou "Fácil" nas últimas 3 sessões. Hora de subir para ${LV[S.levels[sug]+1]}.</p>
    <div class="row"><button class="btn" data-up="${sug}">Subir de nível</button><button class="ghost" data-dismiss="${sug}">Agora não</button></div></section>`;
  h+=`<section class="card"><span class="label">O que tem no treino ${t}</span><div>${listItems(t).map(e=>exRow(e,false)).join('')}</div>
    <p class="muted" style="font-size:14px">${summary(t)}</p>
    <p class="muted" style="font-size:14px">Descanso: ${S.restPref&&S.restPref!=='auto'?fmtRest(restOf(w,lv)):'automático'} · Contagem pela voz: ${countOn()?'ligada':'desligada'}</p>
    <button class="ghost" data-go="plano">Ajustar descanso e contagem</button></section>`;
  h+=`<section class="card"><div class="row" style="justify-content:space-between"><h3>Meta da semana</h3><span class="num" style="font-size:22px;font-weight:700">${Math.min(done,G)}/${G}</span></div>
    <div class="week" style="grid-template-columns:repeat(${G},1fr)">${Array.from({length:G},(_,i)=>`<span class="${i<done?'on':''}"></span>`).join('')}</div>

  if(g)h+=dangerCard(false);
  return h+`</div>`;
}
function settingsCard(){
  const auto=W.A.restS?W.A.restS[S.levels.A]:REST[S.levels.A],cur=S.restPref||'auto';

function vPlano(){

  for(const t of ['A','B','C']){
    const w=W[t],lv=S.levels[t];
    h+=`<section class="card"><div><span class="label">Treino ${t} · ${w.kind} · ≈ ${estMin(t)} min</span><h2>${w.title}</h2></div>

function vHist(){

function weightCard(){

    document.body.appendChild(v);AWAKE.video=v;}
  try{const pr=AWAKE.video.play();if(pr)pr.catch(()=>{});}catch(e){}

function keepAwake(){AWAKE.on=true;videoOn();wakeLockOn();}
function letSleep(){AWAKE.on=false;try{AWAKE.lock?.release();}catch(e){}AWAKE.lock=null;try{AWAKE.video?.pause();}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(AWAKE.on&&document.visibilityState==='visible'){videoOn();wakeLockOn();}});
setInterval(()=>{if(AWAKE.on&&document.visibilityState==='visible'){wakeLockOn();if(AWAKE.video&&AWAKE.video.paused)videoOn();}},15000);
let X=null,ac=null,ptVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();ptVoice=v.find(x=>/^pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function say(t,keep,cb){
  /* cb roda quando a fala termina (ou, por segurança, depois de um tempo proporcional ao texto) */
  let done=false;const fin=()=>{if(done)return;done=true;if(cb)cb();};
  if(S.voice===false){if(cb)setTimeout(fin,0);return;}
  try{if(!keep)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';if(ptVoice)u.voice=ptVoice;u.rate=1.05;
    if(cb){u.onend=fin;u.onerror=fin;}speechSynthesis.speak(u);}catch(e){fin();}
  if(cb)setTimeout(fin,Math.min(15000,1200+t.length*85));
}
const NUM={3:'três',2:'dois',1:'um'};
const phaseOf=s=>/^(Série|Volta)/.test(s.ph)?'main':s.ph;
const INTRO={Aquecimento:'Primeiro, o aquecimento. Exercícios leves para esquentar o corpo.',
  Mobilidade:'Agora, mobilidade. Movimentos leves para preparar as articulações para o treino.',
  main:'Começou o treino!',Alongamento:'Treino concluído! Agora vamos alongar. Segure cada posição, sem balançar.',
  Respiração:'Para terminar, respiração e assoalho pélvico.'};
function introFor(i){
  const s=X.steps[i],prev=X.steps.slice(0,i).reverse().find(z=>z.k!=='rest');
  return (!prev||phaseOf(prev)!==phaseOf(s))&&INTRO[phaseOf(s)]?INTRO[phaseOf(s)]+' ':'';
}
function announce(s,cb){
  const intro=s.k==='rest'?'':introFor(X.i);
  if(s.k==='reps'){const ri=repInfo(s.r,s.n),go=countOn()?' Prepare-se... vamos lá!':'';
    const how=ri.alt?`${ri.n} repetições de cada lado, alternando. Comece com ${ri.sd[0][0]}.`:ri.sides>1?`${ri.n} repetições de cada lado. Comece com ${ri.sd[0][0]}.`:`${ri.n} repetições.`;
    say(`${intro}${s.n}. ${how}${go}`,false,cb);}
  else if(s.k==='time')say(`${intro}${s.n}. ${s.t} segundos.`,false,cb);
  else if(s.ph==='Prepare-se')say('Prepare-se. O treino começa com o aquecimento.');
  else if(s.tr)say(`Aquecimento concluído! Respire fundo e beba um gole de água. Em ${s.t} segundos começa o treino, com ${s.next}.`);
  else{const m=(s.next||'').match(/^(.*) · série (\d+)$/);
    say(m?`Descanse. Depois, série ${m[2]} de ${m[1]}.`:s.ph==='Fim da volta'?`Fim da volta. Descanse. A seguir, ${s.next}.`:`Descanse. Próximo exercício: ${s.next||'o próximo'}.`);}
}
/* contagem guiada: fala cada repetição no ritmo do exercício */
function repTick(s){
  const r=X.rep,now=Date.now();r.t+=Math.min(now-r.last,500)/1000;r.last=now;
  const ri=repInfo(s.r,s.n),cad=cadOf(s);
  if(r.stage==='lead'&&r.t>=LEADGO){r.stage='count';r.t0=r.t;}
  if(r.stage==='count'){
    if(ri.alt){
      /* alternado: cada movimento troca de lado; o número sobe a cada par */
      const M=ri.n*2,j=Math.min(M,Math.floor((r.t-r.t0)/cad));
      if(j>r.j){r.j=j;r.i=Math.ceil(j/2);r.side=(j-1)%2+1;const nm=ri.sd[1][r.side-1];
        if(S.voice===false)beep(r.side===1?990:740,.08);else say(`${nm} ${r.i}${j===M?'. Última!':''}`);repShow(ri);}
      if(r.j>=M&&r.t-r.t0>=M*cad+1.6){r.stage='done';r.t0=r.t;say('Série concluída! Muito bem.',true);}
    }else{
      const k=Math.min(ri.n,Math.floor((r.t-r.t0)/cad));
      if(k>r.i){r.i=k;if(S.voice===false)beep(990,.08);else say(k===ri.n&&r.side===ri.sides?k+'. Última!':String(k));repShow(ri);}
      if(r.i>=ri.n&&r.t-r.t0>=ri.n*cad+1.6){
        if(r.side<ri.sides){r.side++;r.i=0;r.stage='swap';r.t0=r.t;say(`Agora, ${ri.sd[0][1]}.`,true);repShow(ri);}
        else{r.stage='done';r.t0=r.t;say('Série concluída! Muito bem.',true);}
      }
    }
  }else if(r.stage==='swap'&&r.t-r.t0>=SWAP){r.stage='count';r.t0=r.t;}
  else if(r.stage==='done'&&r.t-r.t0>=2.4){r.stage='end';advance();}
}
const sideLabel=ri=>{const t=ri.sd[0][(X.rep?X.rep.side:1)-1].replace(/^(a|o) /,'');return t[0].toUpperCase()+t.slice(1);};
function repShow(ri){const b=$('#repn'),u=$('#repside');if(b)b.textContent=X.rep.i;if(u&&ri.sides>1)u.textContent=sideLabel(ri);}
function beep(f,d){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d);}catch(e){}}
async function startSession(type){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}
  keepAwake();
  const cfg=config(type),steps=makeSteps(type,cfg),lv=S.levels[type],w=W[type];
  steps.unshift({k:'rest',ph:'Prepare-se',t:6,next:steps[0].n});
  const demo=w.circuit?w.items[lv].map(e=>({...e,dose:`${w.work[lv]}s de esforço · ${cfg.rounds} ${cfg.rounds>1?'voltas':'volta'}`}))
    :cfg.ex.map(e=>({...e,dose:e.s+' séries de '+(e.h?e.h+' segundos':e.r+' repetições').replace(' repetições',/por /.test(e.r||'')?'':' repetições')}));
  X={type,steps,demo,di:0,mode:'demo',i:0,t0:Date.now(),end:0,left:0,paused:false,last:-1,confirm:false,done:false};
  $('#session').hidden=false;document.body.style.overflow='hidden';renderS();
  say(`Treino ${type}. Veja os exercícios antes de começar, ou pule a demonstração.`);
}
function beginWork(){X.mode='run';X.t0=Date.now();X.i=0;enter();}
function enter(){const s=X.steps[X.i];X.paused=false;X.last=-1;X.said={};X.stepStart=Date.now();
  X.rep=s.k==='reps'?{t:0,last:Date.now(),i:0,j:0,side:1,stage:'lead'}:null;
  /* exercícios só começam depois que a voz termina a instrução */
  X.wait=s.k!=='rest';const tok=X.tok=(X.tok||0)+1;
  if(s.t){X.left=s.t;X.end=Date.now()+s.t*1000;}renderS();announce(s,()=>go(tok));}
function go(tok){if(!X||X.tok!==tok||!X.wait)return;X.wait=false;const s=X.steps[X.i];if(!s)return;
  if(s.t)X.end=Date.now()+X.left*1000;if(X.rep)X.rep.last=Date.now();renderS();}
function advance(){X.i++;if(X.i>=X.steps.length){finish();return;}beep(1320,.25);enter();}
function finish(){X.done=true;X.mins=Math.max(1,Math.round((Date.now()-X.t0)/60000));renderS();say('Treino concluído. Mandou bem!');}
setInterval(()=>{
  if(!X||X.done||X.paused||X.confirm||X.wait||X.mode==='demo')return;const s=X.steps[X.i];
  if(s.k==='reps'){if(countOn()&&X.rep)repTick(s);else{const el=$('#elapsed');if(el)el.textContent=fmt((Date.now()-X.stepStart)/1000);}return;}
  X.left=(X.end-Date.now())/1000;const sec=Math.ceil(X.left);
  if(s.k==='time'&&s.t>=40&&sec===Math.ceil(s.t/2)&&!X.said.half){X.said.half=1;say('Metade.');}
  if(s.k==='time'&&s.t>=30&&sec===10&&!X.said.ten){X.said.ten=1;say('Faltam dez segundos.');}
  if(sec<=3&&sec>0&&sec!==X.last){X.last=sec;if(S.voice===false)beep(880,.12);else say(NUM[sec]);
    const st=document.querySelector('.stage');if(st){st.classList.remove('tick');void st.offsetWidth;st.classList.add('tick');}}
  if(X.left<=0){advance();return;}
  const el=$('#clock');if(el)el.textContent=s.t>=60?fmt(X.left):sec;
},200);
function renderS(){
  const el=$('#session');
  if(X.done){
    el.innerHTML=`<div class="s-in"><div class="s-top"><span class="label" style="flex:1">Treino ${X.type} concluído</span></div>
      <div class="stage rest"><div><span class="label">${W[X.type].title}</span><h2>Mandou bem!</h2></div>
      <div class="mainrow"><span class="big num">${X.mins}</span><span class="unit">minutos</span></div>
      <p class="cue">${GEST()?'Como você se sentiu? Se sentiu qualquer desconforto, marque abaixo.':'Como foi o treino? Isso ajuda a decidir quando subir de nível.'}</p></div>
      <div class="s-ctrl">${Object.entries(FEEL).map(([k,v],i)=>`<button class="${i===1?'btn wide':'ghost'}" ${k==='desconf'?'style="grid-column:1/-1"':''} data-feel="${k}">${v}</button>`).join('')}</div></div>`;
    return;
  }
  const vbtn=`<button class="vbtn" data-s="voice" aria-pressed="${S.voice!==false}">Voz ${S.voice!==false?'ligada':'desligada'}</button>`;
  if(X.mode==='demo'){
    const e=X.demo[X.di],n=X.demo.length,last=X.di===n-1;
    el.innerHTML=`<div class="s-in"><div class="s-top"><div class="bar"><i style="width:${(X.di+1)/n*100}%;background:var(--accent)"></i></div>${vbtn}<button class="x" data-s="close" aria-label="Fechar">×</button></div>
      <div class="stage prep"><div><span class="label">Demonstração · ${X.di+1} de ${n}</span><h2>${e.n}</h2></div>${fig(e.f)}
      <div><p class="cue" style="font-weight:700;margin-bottom:6px">${e.dose}</p><p class="cue">${e.c}</p></div></div>
      <div class="s-ctrl"><button class="btn wide" data-s="${last?'go':'dnext'}">${last?'Começar treino':'Próximo exercício'}</button>
      <button class="ghost" data-s="dback" ${X.di===0?'disabled':''}>Voltar</button><button class="ghost" data-s="go">Pular demonstração</button></div>
      ${X.confirm?confirmBox():''}</div>`;
    return;
  }
  const s=X.steps[X.i],pct=X.i/X.steps.length*100;
  const cls=s.k==='rest'?'rest':['Aquecimento','Mobilidade','Alongamento','Respiração'].includes(s.ph)?'prep':'work';
  let main,ctrl;
  const waitMsg=X.wait?`<p class="next" style="margin-top:6px"><b>Ouça a instrução.</b> Começa quando a voz terminar.</p>`:'';
  if(s.k==='reps'){const side=s.r.match(/por \S+/),ri=repInfo(s.r,s.n);
    main=countOn()?`<div><div class="mainrow"><span class="big num" id="repn">${X.rep?X.rep.i:0}</span><span class="unit">de ${ri.n} repetições</span></div>
      ${waitMsg||`<p class="next" style="margin-top:6px">${ri.sides>1?`<b id="repside">${sideLabel(ri)}</b> · `:''}${ri.alt?'Alternando a cada repetição':ri.sides>1?'Um lado de cada vez':'A voz conta no ritmo do exercício'}</p>`}</div>`
      :`<div><div class="mainrow"><span class="big num">${s.r.replace(/ por \S+/,'')}</span><span class="unit">repetições${side?' '+side[0]:''}</span></div>
      <p class="next" style="margin-top:6px">Tempo nesta série: <b class="num" id="elapsed" style="font-size:18px">0:00</b></p></div>`;
    ctrl=countOn()?`${X.wait?'<button class="btn wide" data-s="now">Começar agora</button>':`<button class="btn wide" data-s="pause">${X.paused?'Continuar':'Pausar'}</button>`}<button class="ghost" data-s="ok">Concluí a série</button><button class="ghost" data-s="back">Voltar</button>`
      :`<button class="btn wide" data-s="ok">Concluí a série</button><button class="ghost" data-s="back">Voltar</button><button class="ghost" data-s="skip">Pular</button>`;}
  else{const v=X.paused?X.left:s.t;main=`<div class="mainrow"><span class="big num" id="clock">${s.t>=60?fmt(v):Math.ceil(v)}</span><span class="unit">${s.t>=60?'':'segundos'}</span></div>${s.k==='rest'?'':waitMsg}`;
    ctrl=s.k==='rest'?`<button class="btn wide" data-s="skip">${s.tr?'Começar o treino agora':'Pular descanso'}</button><button class="ghost" data-s="minus">−15 s</button><button class="ghost" data-s="plus">+15 s</button><button class="ghost" data-s="pause">${X.paused?'Continuar':'Pausar'}</button>`
      :`${X.wait?'<button class="btn wide" data-s="now">Começar agora</button>':`<button class="btn wide" data-s="pause">${X.paused?'Continuar':'Pausar'}</button>`}<button class="ghost" data-s="back">Voltar</button><button class="ghost" data-s="skip">Pular</button>`;}
  let title,illo,sub;
  if(s.k==='rest'){
    const nx=X.steps.slice(X.i+1).find(z=>z.k!=='rest');
    title=s.ph==='Prepare-se'?'Prepare-se':s.tr?'Agora vem o treino':'Respire';
    illo=nx?fig(nx.f):'';
    sub=s.next?`<p class="next">A seguir: <b>${s.next}</b></p>`:'';
  }else{title=s.n;illo=fig(s.f);sub=`<p class="cue">${s.c}</p>`+(s.next?`<p class="next">A seguir: ${s.next}</p>`:'');}
  el.innerHTML=`<div class="s-in"><div class="s-top"><div class="bar"><i style="width:${pct}%"></i></div>${vbtn}<button class="x" data-s="close" aria-label="Encerrar treino">×</button></div>
    <div class="stage ${cls}"><div><span class="label">${s.ph}</span><h2>${title}</h2></div>${illo}${main}<div>${sub}</div></div>
    <div class="s-ctrl${s.k==='rest'?' three':''}">${ctrl}</div>
    ${X.confirm?confirmBox():''}</div>`;
}
const confirmBox=()=>`<div class="confirm"><div class="card"><h3>Encerrar o treino?</h3><p class="muted">Esta sessão não vai entrar no histórico.</p><div class="row"><button class="btn" data-s="resume">Continuar treinando</button><button class="ghost" data-s="quit">Encerrar</button></div></div></div>`;
function closeS(){$('#session').hidden=true;document.body.style.overflow='';letSleep();X=null;route();}
$('#session').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!X)return;const a=b.dataset.s;
  if(b.dataset.feel){S.history.push({date:new Date().toISOString(),type:X.type,level:S.levels[X.type],mins:X.mins,feel:b.dataset.feel,mode:GEST()?'gest':'n'});
    if(b.dataset.feel==='desconf'){S.lastDiscomfort=new Date().toISOString();if(nextType()===X.type)S.rot=(S.rot+1)%rotation().length;save();closeS();location.hash='hoje';return;}
    if(nextType()===X.type)S.rot=(S.rot+1)%rotation().length;save();closeS();location.hash='historico';return;}
  if(a==='voice'){S.voice=S.voice===false;save();if(S.voice===false){try{speechSynthesis.cancel();}catch(e){}}else say('Voz ligada.');renderS();return;}
  if(X.mode==='demo'){
    if(a==='dnext'){X.di++;renderS();say(X.demo[X.di].n);}
    else if(a==='dback'&&X.di>0){X.di--;renderS();say(X.demo[X.di].n);}
    else if(a==='go')beginWork();
    else if(a==='close'){X.confirm=true;renderS();}
    else if(a==='resume'){X.confirm=false;renderS();}
    else if(a==='quit')closeS();
    return;
  }
  const s=X.steps[X.i];
  if(a==='ok'||a==='skip')advance();
  else if(a==='back'){if(X.i>0){X.i--;enter();}}
  else if(a==='plus'){X.end+=15000;X.left+=15;if(X.paused)renderS();}
  else if(a==='minus'){const nl=Math.max(3,X.left-15);X.end-=(X.left-nl)*1000;X.left=nl;if(X.paused)renderS();}
  else if(a==='pause'){if(X.rep)X.rep.last=Date.now();if(X.paused){X.end=Date.now()+X.left*1000;X.paused=false;}else{X.left=(X.end-Date.now())/1000;X.paused=true;}renderS();}
  else if(a==='now'){try{speechSynthesis.cancel();}catch(e){}go(X.tok);}
  else if(a==='close'){if(s.t&&!X.paused&&!X.wait)X.left=(X.end-Date.now())/1000;X.confirm=true;renderS();}
  else if(a==='resume'){X.confirm=false;if(X.rep)X.rep.last=Date.now();if(s.t)X.end=Date.now()+X.left*1000;renderS();}
  else if(a==='quit')closeS();
});
route();
requestAnimationFrame(animate);
